<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Receitanet BX</title>
    <style>
      :root {
        --ink: #171a1f; --soft: #4c525c; --faint: #7b8189;
        --line: #dfdbd2; --primary: #0e5a5e; --primary-dark: #0a474b;
        --ok: #1f6f43; --ok-bg: #e2efe6; --err: #9e2b2b; --err-bg: #f6e1e0;
        --warn: #8a5a00; --warn-bg: #f6ebd5; --surface: #faf9f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px 18px 22px; background: #fff; color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      h1 { font-size: 15px; margin: 0; }
      .sub { color: var(--faint); font-size: 12px; margin-top: 2px; }
      .pill {
        display: inline-block; padding: 3px 9px; border-radius: 999px;
        font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      }
      .pill.ok { background: var(--ok-bg); color: var(--ok); }
      .pill.err { background: var(--err-bg); color: var(--err); }
      .pill.warn { background: var(--warn-bg); color: var(--warn); }
      .pill.idle { background: #ece9e2; color: var(--soft); }

      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      label { display: grid; gap: 5px; margin-bottom: 10px; }
      label.wide { grid-column: 1 / -1; }
      label span {
        font-size: 11px; font-weight: 600; letter-spacing: .04em;
        text-transform: uppercase; color: var(--soft);
      }
      input, select {
        height: 34px; border: 1px solid var(--line); border-radius: 6px;
        padding: 0 9px; font: inherit; background: #fff; color: var(--ink); width: 100%;
      }
      input[type="checkbox"] { width: auto; height: auto; }
      input:focus-visible, select:focus-visible, button:focus-visible {
        outline: 2px solid #e1edec; border-color: var(--primary);
      }
      .check { display: flex; align-items: center; gap: 8px; }
      .check span { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--ink); }

      .actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
      button {
        height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--primary);
        background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: var(--primary-dark); }
      button.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
      button:disabled { opacity: .55; cursor: progress; }

      .result {
        margin-top: 14px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--surface); padding: 12px; min-height: 68px;
      }
      .result .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
      .result .meta { color: var(--soft); font-size: 12px; }
      .result ul { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--soft); }
      .hint { margin-top: 12px; color: var(--faint); font-size: 11.5px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Receitanet BX</h1>
        <div class="sub" id="subtitulo">escolha a operação e execute</div>
      </div>
      <span class="pill idle" id="estado">pronto</span>
    </header>

    <label>
      <span>Operação</span>
      <select id="automacao"></select>
    </label>

    <form id="campos" class="row" autocomplete="off"></form>

    <div class="actions">
      <button id="go" type="button">Executar</button>
      <button id="limpar" type="button" class="ghost">Limpar</button>
    </div>

    <div class="result" id="resultado">
      <span class="meta">O resultado da operação aparece aqui.</span>
    </div>

    <p class="hint">
      Antes de baixar ou criar pedidos, feche o programa oficial do Receitanet: ele usa o mesmo
      banco local e a operação falha com <em>BOT_BANCO_OCUPADO</em>.
    </p>

    <script>
      (function () {
        var automacoes = [];
        var selecionada = null;
        var select = document.getElementById("automacao");
        var campos = document.getElementById("campos");
        var go = document.getElementById("go");
        var estado = document.getElementById("estado");
        var resultado = document.getElementById("resultado");
        var subtitulo = document.getElementById("subtitulo");

        function definirEstado(texto, classe) {
          estado.textContent = texto;
          estado.className = "pill " + classe;
        }

        function porId(id) {
          for (var i = 0; i < automacoes.length; i++) {
            if (automacoes[i].id === id) return automacoes[i];
          }
          return null;
        }

        function montarCampos(automacao) {
          campos.innerHTML = "";
          var params = (automacao && automacao.params) || [];
          if (!params.length) {
            var aviso = document.createElement("label");
            aviso.className = "wide";
            var texto = document.createElement("span");
            texto.textContent = "Esta operação não precisa de campos.";
            aviso.appendChild(texto);
            campos.appendChild(aviso);
            return;
          }
          params.forEach(function (param) {
            var label = document.createElement("label");
            if (param.type === "BOOLEAN") label.className = "check";
            var rotulo = document.createElement("span");
            rotulo.textContent = param.name + (param.required ? " *" : "");
            var input;
            if (param.type === "BOOLEAN") {
              input = document.createElement("input");
              input.type = "checkbox";
              label.appendChild(input);
              label.appendChild(rotulo);
            } else {
              input = document.createElement("input");
              input.type = param.sensitive ? "password" : param.type === "INTEGER" ? "number" : "text";
              input.placeholder = param.sensitive ? "não é exibido depois" : "";
              if (param.required) input.required = true;
              label.appendChild(rotulo);
              label.appendChild(input);
            }
            input.dataset.nome = param.name;
            input.dataset.tipo = param.type;
            campos.appendChild(label);
          });
        }

        function coletar() {
          var params = {};
          var inputs = campos.querySelectorAll("input");
          for (var i = 0; i < inputs.length; i++) {
            var input = inputs[i];
            if (input.dataset.tipo === "BOOLEAN") {
              if (input.checked) params[input.dataset.nome] = true;
              continue;
            }
            var valor = input.value.trim();
            if (!valor) {
              if (input.required) {
                input.focus();
                definirEstado("falta " + input.dataset.nome, "warn");
                return null;
              }
              continue;
            }
            params[input.dataset.nome] = input.dataset.tipo === "INTEGER" ? Number(valor) : valor;
          }
          return params;
        }

        function mostrarResultado(mensagem) {
          resultado.innerHTML = "";
          var titulo = document.createElement("div");
          titulo.className = "title";
          titulo.textContent = mensagem.status === "SUCCESS" ? "Concluído" : "Não concluído";
          var meta = document.createElement("div");
          meta.className = "meta";
          var partes = [];
          if (mensagem.durationMillis != null) partes.push("duração " + mensagem.durationMillis + " ms");
          if (mensagem.runId) partes.push("execução " + String(mensagem.runId).slice(0, 8));
          if (mensagem.errorCode) partes.push("código " + mensagem.errorCode);
          meta.textContent = partes.join(" · ");
          resultado.appendChild(titulo);
          resultado.appendChild(meta);

          if (mensagem.message) {
            var texto = document.createElement("div");
            texto.className = "meta";
            texto.style.marginTop = "6px";
            texto.textContent = mensagem.message;
            resultado.appendChild(texto);
          }
          var chaves = mensagem.outputs ? Object.keys(mensagem.outputs) : [];
          if (chaves.length) {
            var lista = document.createElement("ul");
            chaves.forEach(function (chave) {
              var item = document.createElement("li");
              item.textContent = chave + ": " + mensagem.outputs[chave];
              lista.appendChild(item);
            });
            resultado.appendChild(lista);
          }
        }

        select.addEventListener("change", function () {
          selecionada = porId(select.value);
          montarCampos(selecionada);
          subtitulo.textContent = selecionada ? selecionada.description || selecionada.id : "";
          definirEstado("pronto", "idle");
        });

        go.addEventListener("click", function () {
          if (!selecionada) return;
          var params = coletar();
          if (params === null) return;
          go.disabled = true;
          definirEstado("executando", "warn");
          resultado.innerHTML = '<span class="meta">Executando… pode levar alguns minutos.</span>';
          parent.postMessage(
            { type: "sia:execute", automation: selecionada.id, params: params },
            "*"
          );
        });

        document.getElementById("limpar").addEventListener("click", function () {
          montarCampos(selecionada);
          definirEstado("pronto", "idle");
        });

        addEventListener("message", function (event) {
          var mensagem = event.data || {};
          if (mensagem.type === "sia:init") {
            automacoes = mensagem.automations || [];
            select.innerHTML = "";
            automacoes.forEach(function (automacao) {
              var opcao = document.createElement("option");
              opcao.value = automacao.id;
              opcao.textContent = automacao.name || automacao.id;
              select.appendChild(opcao);
            });
            if (mensagem.automation && porId(mensagem.automation.id)) {
              select.value = mensagem.automation.id;
            }
            selecionada = porId(select.value) || automacoes[0] || null;
            montarCampos(selecionada);
            if (selecionada) subtitulo.textContent = selecionada.description || selecionada.id;
          }
          if (mensagem.type === "sia:result") {
            go.disabled = false;
            definirEstado(mensagem.status === "SUCCESS" ? "concluído" : "falhou", mensagem.status === "SUCCESS" ? "ok" : "err");
            mostrarResultado(mensagem);
          }
        });

        parent.postMessage({ type: "sia:ready" }, "*");
      })();
    </script>
  </body>
</html>
