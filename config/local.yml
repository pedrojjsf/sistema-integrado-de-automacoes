# Configuracao local do SIA (exemplo versionado, sem segredos reais)
server:
  host: 127.0.0.1
  port: 8080

database:
  path: data/sia.db

plugins:
  directory: plugins

# Fuso do SIA: agenda e horarios exibidos usam Brasilia.
scheduler:
  zone: America/Sao_Paulo

auth:
  # none: sem login. Só é aceito com bind em loopback (127.0.0.1/localhost).
  # A autenticação de verdade acontece dentro de cada automação (ex.: certificado digital).
  # Para exigir chave, use mode: dev e preencha tokens.
  mode: none
  tokens: {}

processes:
  receitanet-bx:
    # ${java.home} e ${env:VAR} sao resolvidos pelo Core na subida.
    command:
      - "${java.home}/bin/java"
      - "--add-opens=java.base/java.security=ALL-UNNAMED"
      - "--add-exports=jdk.crypto.mscapi/sun.security.mscapi=ALL-UNNAMED"
      - "-Djava.awt.headless=true"
      - "-Dfile.encoding=UTF-8"
      - "-cp"
      - "automacao/ReceitanetBX-Bot/app/receitanetbx-bot.jar"
      - "numberia.bot.Inicio"
    timeout-minutes: 15
