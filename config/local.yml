# Configuracao local do SIA (exemplo versionado, sem segredos reais)
server:
  host: 127.0.0.1
  port: 8080

database:
  path: data/sia.db

plugins:
  directory: plugins

# Fuso do SIA: agenda e horarios exibidos usam Brasilia.
scheduler:
  zone: America/Sao_Paulo

auth:
  # none: sem login. So e aceito com bind em loopback (127.0.0.1/localhost).
  # A autenticacao de verdade acontece dentro de cada automacao (ex.: certificado digital).
  # Para exigir chave, use mode: dev e preencha tokens.
  mode: none
  tokens: {}

# Allowlist de executaveis que plugins podem chamar por nome logico.
# Exemplo (descomente e ajuste ao seu ambiente):
#
# processes:
#   meu-bot:
#     command: ["${java.home}/bin/java", "-cp", "app/meu-bot.jar", "com.exemplo.Main"]
#     timeout-minutes: 15
processes: {}
