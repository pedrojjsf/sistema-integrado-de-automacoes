name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 23 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Node 20 (só para a checagem de tipos do frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependências do frontend
        run: npm install --no-audit --no-fund

      # O bit de execução não é preservado ao commitar de um checkout Windows, e o wrapper
      # precisa baixar o Maven (já falhou com "wget: Failed to fetch" no runner). Usamos o
      # Maven pré-instalado da imagem e caímos para o wrapper só quando ele não existir.
      - name: Build e testes (Maven)
        run: |
          set -euo pipefail
          if command -v mvn >/dev/null 2>&1; then
            echo "mvn: $(mvn -v | head -n 1)"
            MVN=mvn
          else
            chmod +x mvnw
            MVN=./mvnw
          fi
          "$MVN" -B -ntp clean verify

      - name: Checagem de tipos do frontend
        run: npm run check
