name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 23 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Node 20 (só para a checagem de tipos do frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # o bit de execução não é preservado ao commitar de um checkout Windows;
      # sem isto o passo do Maven falha em "Permission denied" antes de qualquer teste
      - name: Garantir bit de execução dos scripts
        run: chmod +x mvnw bin/sia bin/siad || true

      - name: Dependências do frontend
        run: npm install --no-audit --no-fund

      - name: Build e testes (Maven)
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee mvn-ci.log

      - name: publicar log de falha
        if: failure() && matrix.os == 'ubuntu-latest'
        run: |
          git config user.name ci-diag
          git config user.email ci-diag@example.invalid
          git checkout -B ci-ci-log
          git add -f mvn-ci.log
          git commit -m 'log de falha do ci' || true
          git push --force origin ci-ci-log

      - name: Checagem de tipos do frontend
        run: npm run check
