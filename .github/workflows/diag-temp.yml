name: diag-temp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: rodar e capturar
        run: |
          set +e
          mvn -B -ntp clean verify > mvn.log 2>&1
          echo "maven_exit=$?" >> mvn.log
          mkdir -p reports
          cp -r sia-core/target/surefire-reports/*.txt reports/ 2>/dev/null
          cp -r sia-server/target/surefire-reports/*.txt reports/ 2>/dev/null
          tail -n 60 mvn.log
      - name: publicar
        run: |
          git config user.name ci-diag
          git config user.email ci-diag@example.invalid
          git checkout -B ci-log
          git add -f mvn.log reports 2>/dev/null || git add -f mvn.log
          git commit -m "ci diag" || true
          git push --force origin ci-log
